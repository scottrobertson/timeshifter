[package]
name = "timeshifter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["form", "query"] }
base64 = "0.23"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
percent-encoding = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7"
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
