name: CI

on:
  push:

env:
  TAILWIND_VERSION: v4.3.3
  # Pushes from this branch go out as the "next" image, for trying before it's merged.
  NEXT_BRANCH: rust-web-app

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # build.rs needs Tailwind to build the stylesheet that gets baked into the binary.
      - name: Install Tailwind
        run: |
          curl -fsSL -o /usr/local/bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x /usr/local/bin/tailwindcss

      # Saved even when clippy or a test fails, so the next run doesn't build every
      # dependency from scratch again.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  docker:
    # Builds on every branch once the tests pass. Only pushes from main, as latest, and
    # from NEXT_BRANCH, as next.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether to push
        run: echo "PUSH=${{ github.ref == 'refs/heads/main' || github.ref == format('refs/heads/{0}', env.NEXT_BRANCH) }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=next,enable=${{ github.ref == format('refs/heads/{0}', env.NEXT_BRANCH) }}
            type=sha

      # Loaded into the local docker so it can be booted before anything is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catches anything that only breaks at runtime, like a missing system library. It
      # starts with no provider set, which is fine: the pages still load.
      - name: Smoke test the image boots
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name smoke -p 8080:8080 "$IMAGE"
          ok=
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then ok=1; break; fi
            if [ -z "$(docker ps -q -f name=smoke)" ]; then echo "container exited early"; break; fi
            sleep 1
          done
          docker exec smoke ffmpeg -version >/dev/null || ok=
          docker exec smoke sh -c 'command -v comskip' >/dev/null || ok=
          echo "--- container logs ---"
          docker logs smoke
          docker rm -f smoke >/dev/null 2>&1 || true
          [ "$ok" = 1 ] || { echo "image did not boot"; exit 1; }

      - name: Push
        if: env.PUSH == 'true'
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -n1 docker push
