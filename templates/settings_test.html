<div class="rounded-lg border px-3 py-2.5 text-[13px] {% if ok %}border-success/40 bg-success/10 text-success{% else %}border-error/40 bg-error/10 text-error{% endif %}">
  <div>{{ message }}</div>
  {% if !details.is_empty() %}<div class="mt-0.5 text-xs opacity-80">{{ details|join(" · ") }}</div>{% endif %}
</div>
